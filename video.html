<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://db.onlinewebfonts.com/c/04e6981992c0e2e7642af2074ebe3901?family=Helvetica+Now+Display+Bold">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@700&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --font-heading:'Helvetica Now Display Bold','Onest',sans-serif;
  --font-body:'Inter',sans-serif;
  --color-text:#192837; --color-accent:#7342E2; --color-login-bg:#F2F2EE;
}
*{box-sizing:border-box;} html,body{margin:0;padding:0;}
a{text-decoration:none;}
@media (prefers-reduced-motion: reduce){ .rm-none{transition:none !important;} }
</style>
</helmet>
<div style="position:relative; width:100%; min-height:100vh; font-family:var(--font-body); color:var(--color-text); overflow:hidden;">
  <video ref="{{ setVideoRef }}" autoPlay="{{ true }}" muted="{{ true }}" loop="{{ true }}" playsInline="{{ true }}" src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260518_003132_8b7edcb6-c64d-4a52-a9ca-879942e122ad.mp4" style="position:absolute; inset:0; width:100%; height:100%; object-fit:cover; z-index:0;"></video>
  <div aria-hidden="true" style="position:absolute; inset:0; background:linear-gradient(90deg, rgba(242,242,238,0.92) 0%, rgba(242,242,238,0.72) 45%, rgba(242,242,238,0.25) 100%); z-index:1;"></div>

  <nav style="position:relative; z-index:10; max-width:1280px; margin:0 auto; padding:16px 20px; display:flex; align-items:center; justify-content:space-between; gap:24px;" data-nav-pad="true">
    <a href="#" aria-label="rawabits" style="display:flex; align-items:center; gap:10px;">
      <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="none" overflow="visible" viewBox="0 0 256 256"><path d="M 64 128 L 64.5 128 L 32 95 L 0 64 L 0 0 L 64 0 L 128 64 L 128 64.5 L 161 32 L 192 0 L 256 0 L 256 64 L 192 128 L 128 128 L 128 192 L 96 223 L 63.5 256 L 0 256 L 0 192 Z M 256 192 L 224 223 L 191.5 256 L 128 256 L 128 192 L 192 128 L 256 128 Z" fill="#192837"></path></svg>
      <span style="font-family:var(--font-heading); font-size:19px; color:#192837; letter-spacing:-0.01em;">rawabits</span>
    </a>
    <div style="display:none; align-items:center; gap:20px; font-size:14px; font-weight:500; flex-shrink:1; flex-wrap:wrap; justify-content:center;" data-desktop-links="true">
      <sc-for list="{{ t.navLinks }}" as="link" hint-placeholder-count="5">
        <a href="#" style="color:#192837; opacity:0.85;" style-hover="opacity:1;">{{ link }}</a>
      </sc-for>
    </div>
    <div style="display:flex; align-items:center; gap:20px;">
      <div style="display:none; align-items:center; gap:16px; flex-shrink:0;" data-desktop-right="true">
        <div style="display:flex; align-items:center; gap:6px; font-size:14px; font-weight:500;">
          <button onClick="{{ setLangRu }}" aria-label="Русский" style="background:none; border:none; cursor:pointer; padding:0; font-family:inherit; font-size:inherit; font-weight:inherit; color:#192837; opacity:{{ opRu }};">RU</button>
          <span style="opacity:0.4;">/</span>
          <button onClick="{{ setLangEn }}" aria-label="English" style="background:none; border:none; cursor:pointer; padding:0; font-family:inherit; font-size:inherit; font-weight:inherit; color:#192837; opacity:{{ opEn }};">EN</button>
        </div>
        <a href="{{ t.whatsapp }}" target="_blank" rel="noopener noreferrer" aria-label="{{ t.ctaText }}" style="background:#7342E2; color:#fff; border-radius:50px; padding:10px 20px; font-size:14px; font-weight:600;">{{ t.navCta }}</a>
        <a href="#cases" aria-label="{{ t.navSecondary }}" style="background:#F2F2EE; color:#192837; border-radius:50px; padding:10px 20px; font-size:14px; font-weight:600;">{{ t.navSecondary }}</a>
      </div>
      <div style="display:flex; align-items:center; gap:6px; font-size:14px; font-weight:500;" data-mobile-lang="true">
        <button onClick="{{ setLangRu }}" aria-label="Русский" style="background:none; border:none; cursor:pointer; padding:0; font-family:inherit; font-size:inherit; font-weight:inherit; color:#192837; opacity:{{ opRu }};">RU</button>
        <span style="opacity:0.4;">/</span>
        <button onClick="{{ setLangEn }}" aria-label="English" style="background:none; border:none; cursor:pointer; padding:0; font-family:inherit; font-size:inherit; font-weight:inherit; color:#192837; opacity:{{ opEn }};">EN</button>
      </div>
      <button onClick="{{ openMenu }}" aria-label="Открыть меню" style="display:flex; background:none; border:none; cursor:pointer; padding:4px;" data-mobile-burger="true">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#192837" stroke-width="1.8" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
      </button>
    </div>
  </nav>

  <div style="position:relative; z-index:5; max-width:1280px; margin:0 auto; padding:0 20px; padding-top:clamp(40px,8vw,72px); display:flex; flex-direction:column; min-height:calc(100vh - 76px);">
    <div style="max-width:620px;">
      <h1 class="rm-none" style="font-family:var(--font-heading); font-size:clamp(1.65rem,5vw,3rem); line-height:1.05; letter-spacing:-0.01em; color:#192837; margin:0 0 24px; opacity:{{ fu0.o }}; transform:translateY({{ fu0.y }}px); transition:{{ fu0.t }};">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#192837" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle; position:relative; top:-2px; margin-right:4px;"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
        {{ t.headingA }}
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#192837" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle; position:relative; top:-2px; margin:0 4px;"><path d="M21 11.5a8.4 8.4 0 0 1-1 4 8.5 8.5 0 0 1-7.5 4.5 8.4 8.4 0 0 1-4-1L3 21l2-5.5a8.4 8.4 0 0 1-1-4A8.5 8.5 0 0 1 8.5 3a8.4 8.4 0 0 1 4-1h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
        {{ t.headingB }}
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#192837" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle; position:relative; top:-2px; margin-left:4px;"><polyline points="22 17 13.5 8.5 8.5 13.5 2 7"></polyline><polyline points="16 17 22 17 22 11"></polyline></svg>
      </h1>
      <p class="rm-none" style="font-family:var(--font-body); font-size:clamp(0.9rem,2.5vw,1.1rem); line-height:1.65; opacity:{{ fu1.o }}; max-width:560px; margin:0 0 32px; transform:translateY({{ fu1.y }}px); transition:{{ fu1.t }};">{{ t.subtext }}</p>
      <a class="rm-none" href="{{ t.whatsapp }}" target="_blank" rel="noopener noreferrer" aria-label="{{ t.ctaText }}" style="display:inline-flex; align-items:center; justify-content:space-between; gap:32px; background:#7342E2; color:#fff; border-radius:50px; padding:17px 24px; font-family:var(--font-body); font-weight:600; font-size:clamp(0.9rem,2vw,1rem); box-shadow:0 4px 24px rgba(115,66,226,0.28); min-width:280px; opacity:{{ fu2.o }}; transform:translateY({{ fu2.y }}px) scale(1); transition:{{ fu2.t }}, transform 0.15s ease, filter 0.15s ease;" style-hover="transform:scale(1.04); filter:brightness(1.1);" style-active="transform:scale(0.96);">
        {{ t.ctaText }}
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="10 8 15 12 10 16"></polyline></svg>
      </a>
      <p class="rm-none" style="font-family:var(--font-body); font-size:13px; font-weight:500; opacity:{{ fu3.o }}; margin-top:14px; display:flex; align-items:center; gap:7px; transform:translateY({{ fu3.y }}px); transition:{{ fu3.t }};">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#192837" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M21 11.5a8.4 8.4 0 0 1-1 4 8.5 8.5 0 0 1-7.5 4.5 8.4 8.4 0 0 1-4-1L3 21l2-5.5a8.4 8.4 0 0 1-1-4A8.5 8.5 0 0 1 8.5 3a8.4 8.4 0 0 1 4-1h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
        {{ t.trustLine }}
      </p>
    </div>

    <div class="rm-none" style="margin-top:clamp(48px,9vw,96px); margin-bottom:32px; padding-top:20px; border-top:1px solid rgba(25,40,55,0.14); max-width:1280px; opacity:{{ fu4.o }}; transform:translateY({{ fu4.y }}px); transition:{{ fu4.t }}; display:flex; align-items:center; gap:28px; flex-wrap:wrap;">
      <span style="font-family:var(--font-body); font-size:11px; text-transform:uppercase; letter-spacing:0.12em; opacity:0.5; font-weight:500;">{{ t.industryLabel }}</span>
      <sc-for list="{{ t.industries }}" as="ind" hint-placeholder-count="5">
        <span style="font-size:14px; font-weight:500; opacity:0.75;">{{ ind }}</span>
      </sc-for>
    </div>
  </div>

  <div aria-hidden="{{ menuHidden }}" style="position:fixed; inset:0; z-index:48; background:rgba(25,40,55,0.35); backdrop-filter:blur(4px); opacity:{{ menuOpen }}; pointer-events:{{ menuPointerEvents }}; transition:opacity 0.3s ease;" onClick="{{ closeMenu }}"></div>
  <div role="dialog" aria-label="Меню" style="position:fixed; right:0; top:0; z-index:49; width:min(88vw,360px); height:100dvh; background:#CFC8C5; box-shadow:-12px 0 48px rgba(25,40,55,0.18); transform:translateX({{ sheetX }}); transition:transform 0.45s cubic-bezier(.22,1,.36,1);">
    <div style="display:flex; align-items:center; justify-content:space-between; padding:20px; border-bottom:1px solid rgba(25,40,55,0.12);">
      <div style="display:flex; align-items:center; gap:10px;">
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" fill="none" overflow="visible" viewBox="0 0 256 256"><path d="M 64 128 L 64.5 128 L 32 95 L 0 64 L 0 0 L 64 0 L 128 64 L 128 64.5 L 161 32 L 192 0 L 256 0 L 256 64 L 192 128 L 128 128 L 128 192 L 96 223 L 63.5 256 L 0 256 L 0 192 Z M 256 192 L 224 223 L 191.5 256 L 128 256 L 128 192 L 192 128 L 256 128 Z" fill="#192837"></path></svg>
        <span style="font-family:var(--font-heading); font-size:18px; color:#192837;">rawabits</span>
      </div>
      <button onClick="{{ closeMenu }}" aria-label="Закрыть меню" style="background:none; border:none; cursor:pointer; padding:4px;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#192837" stroke-width="1.8" stroke-linecap="round"><line x1="5" y1="5" x2="19" y2="19"></line><line x1="19" y1="5" x2="5" y2="19"></line></svg>
      </button>
    </div>
    <div style="display:flex; flex-direction:column; gap:22px; padding:28px 24px;">
      <sc-for list="{{ t.navLinksKeyed }}" as="link" hint-placeholder-count="5">
        <a key="{{ link.key }}" href="#" onClick="{{ closeMenu }}" style="font-size:16px; font-weight:500; color:#192837; opacity:{{ menuOpen }}; transform:translateX({{ sheetItemX }}px); transition:opacity 0.4s cubic-bezier(.22,1,.36,1) {{ link.delay }}s, transform 0.4s cubic-bezier(.22,1,.36,1) {{ link.delay }}s;">{{ link.text }}</a>
      </sc-for>
      <div style="display:flex; flex-direction:column; gap:12px; margin-top:12px;">
        <a href="{{ t.whatsapp }}" target="_blank" rel="noopener noreferrer" aria-label="{{ t.ctaText }}" style="text-align:center; background:#7342E2; color:#fff; border-radius:50px; padding:14px 20px; font-size:15px; font-weight:600;">{{ t.navCta }}</a>
        <a href="#cases" onClick="{{ closeMenu }}" aria-label="{{ t.navSecondary }}" style="text-align:center; background:#F2F2EE; color:#192837; border-radius:50px; padding:14px 20px; font-size:15px; font-weight:600;">{{ t.navSecondary }}</a>
      </div>
    </div>
  </div>

  <style>
    @media (min-width: 768px){
      [data-desktop-links]{ display:flex !important; }
      [data-desktop-right]{ display:flex !important; }
      [data-mobile-lang]{ display:none !important; }
      [data-mobile-burger]{ display:none !important; }
    }
  </style>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
const WA_RU = "https://wa.me/971509207604?text=%D0%97%D0%B4%D1%80%D0%B0%D0%B2%D1%81%D1%82%D0%B2%D1%83%D0%B9%D1%82%D0%B5%2C%20%D1%85%D0%BE%D1%87%D1%83%20%D0%B4%D0%B8%D0%B0%D0%B3%D0%BD%D0%BE%D1%81%D1%82%D0%B8%D0%BA%D1%83";
const WA_EN = "https://wa.me/971509207604?text=Hi%2C%20I%27d%20like%20the%2040-minute%20diagnostic";

const COPY = {
  ru: {
    whatsapp: WA_RU,
    navLinks: ['Проблема', 'Решение', 'Ниши', 'Диагностика', 'Контакты'],
    navCta: 'Диагностика бесплатно',
    navSecondary: 'Как это работает',
    headingA: 'Показываю, где ваш бизнес теряет',
    headingB: 'заявки и деньги',
    subtext: '40 минут по видеосвязи. Разбираем, как сейчас приходят заявки, в каком месте они пропадают и во сколько это обходится за месяц. Уходите с картой проблем на руках.',
    ctaText: 'Пройти 40-минутную диагностику',
    trustLine: 'Бесплатно. Пишете в WhatsApp, отвечаю лично, обычно в течение часа.',
    industryLabel: 'РАБОТАЕМ С',
    industries: ['Мебель на заказ', 'Автотюнинг', 'Ремонт и отделка', 'Клиники и салоны', 'Недвижимость']
  },
  en: {
    whatsapp: WA_EN,
    navLinks: ['Problem', 'Solution', 'Industries', 'Diagnostic', 'Contact'],
    navCta: 'Free diagnostic',
    navSecondary: 'How it works',
    headingA: 'I show you where your business loses',
    headingB: 'leads and money',
    subtext: 'A 40-minute video call. We map how leads reach you today, where they disappear and what that costs you per month. You leave with the map in hand.',
    ctaText: 'Book the 40-minute diagnostic',
    trustLine: 'Free. Message me on WhatsApp, I answer personally, usually within the hour.',
    industryLabel: 'WE WORK WITH',
    industries: ['Custom furniture', 'Car customisation', 'Renovation', 'Clinics & salons', 'Real estate']
  }
};

class Component extends DCLogic {
  state = { lang: 'ru', menuOpen: false, mounted: false, reducedMotion: false, menuOpenCount: 0 };

  componentDidMount() {
    document.documentElement.lang = this.state.lang;
    const mq = window.matchMedia('(prefers-reduced-motion: reduce)');
    const reduced = mq.matches;
    this.setState({ reducedMotion: reduced, mounted: true });
    if (reduced && this._video) this._video.pause();
  }

  setLang(lang) {
    this.setState({ lang });
    document.documentElement.lang = lang;
  }

  fadeUp(i) {
    const { mounted, reducedMotion } = this.state;
    const shown = reducedMotion || mounted;
    const delay = reducedMotion ? 0 : i * 0.15;
    return {
      o: shown ? 1 : 0,
      y: shown ? 0 : 28,
      t: reducedMotion ? 'none' : `opacity 0.6s cubic-bezier(.22,1,.36,1) ${delay}s, transform 0.6s cubic-bezier(.22,1,.36,1) ${delay}s`
    };
  }

  renderVals() {
    const lang = this.state.lang;
    const t = COPY[lang];
    const menuOpen = this.state.menuOpen;
    const navLinksKeyed = t.navLinks.map((text, i) => ({
      key: `${this.state.menuOpenCount}-${i}`, text, delay: 0.18 + i * 0.07
    }));

    return {
      t: { ...t, navLinksKeyed },
      opRu: lang === 'ru' ? 1 : 0.45,
      opEn: lang === 'en' ? 1 : 0.45,
      setLangRu: () => this.setLang('ru'),
      setLangEn: () => this.setLang('en'),
      setVideoRef: (el) => { this._video = el; },
      menuOpen: menuOpen ? 1 : 0,
      menuHidden: !menuOpen,
      menuPointerEvents: menuOpen ? 'auto' : 'none',
      sheetX: menuOpen ? '0%' : '100%',
      sheetItemX: menuOpen ? 0 : 12,
      openMenu: () => this.setState((s) => ({ menuOpen: true, menuOpenCount: s.menuOpenCount + 1 })),
      closeMenu: () => this.setState({ menuOpen: false }),
      fu0: this.fadeUp(0), fu1: this.fadeUp(1), fu2: this.fadeUp(2), fu3: this.fadeUp(3), fu4: this.fadeUp(4)
    };
  }
}

</script>
</body>
</html>
